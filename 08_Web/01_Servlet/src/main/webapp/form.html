<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Form Data Page</title>
  </head>
  <body>
    <h1>Form Data</h1>
    <form action="form" method="post">
      <div>
        <label for="userId">ID : </label>
        <input type="text" id="userId" name="userId" />
      </div>
      <div>
        <label for="userId">PASSWORD : </label>
        <input type="text" id="userPwd" name="userPwd" />
      </div>
      <div>
        <input type="radio" name="gender" value="M" id="gender1" />
        <label for="gender1">남자</label>
        <input type="radio" name="gender" value="F" id="gender2" />
        <label for="gender2">여자</label>
      </div>

      <div>
        <h2>좋아하는 메뉴</h2>
        <input type="checkbox" name="menu" value="감자" id="menu1" />
        <label for="menu1">감자</label>
        <input type="checkbox" name="menu" value="고구마" id="menu2" />
        <label for="menu2">고구마</label>
        <input type="checkbox" name="menu" value="옥수수" id="menu3" />
        <label for="menu3">옥수수</label>
      </div>
      <input type="submit" value="전송" />
    </form>
  </body>
</html>
